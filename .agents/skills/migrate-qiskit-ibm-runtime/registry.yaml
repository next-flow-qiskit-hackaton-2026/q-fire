# qiskit-ibm-runtime Migration Registry
#
# This file is the entry point for the migrate-qiskit-ibm-runtime skill. It
# enumerates every SUPPORTED migration CHANGE (a breaking change, or a group of
# related ones, in qiskit-ibm-runtime) with routing metadata. It does NOT
# contain the migration content itself — each change grounds in either a live
# doc `url` (release notes / official migration guide) or a hand-curated LOCAL
# `guide` in this skill folder. Never treat this file's `note` or `detect_*`
# fields as a substitute for reading the actual guide.
#
# WHY THIS SKILL IS NOT "PRIMITIVES ONLY":
#   Primitives are the primary interface, so primitive changes are the bulk of
#   any real migration — but qiskit-ibm-runtime has broken plenty of NON-primitive
#   surface too (the `ibm_quantum` channel, `backend.run()`, result streaming,
#   custom programs, ...). This skill migrates ANY version of qiskit-ibm-runtime
#   up to the latest release, treating primitives as one DOMAIN among several.
#
# ─────────────────────────────────────────────────────────────────────────────
# TWO-LAYER DESTINATION (read `target_rule` below in full):
#   Hop A — reach the latest DOCUMENTED API. Every change whose grounding is a
#           release-note / migration-guide `url`. These are public and dated.
#   Hop B — adopt the CLIENT-SIDE (Executor-backed) primitives. Fully released in
#           qiskit-ibm-runtime 0.50.0, which also DEPRECATES the server-side
#           SamplerV2/EstimatorV2 in favor of them, AND published as its own
#           migration guide — so hop B is now `url`-grounded like any hop-A change.
#           The distinction between the hops is now only WHAT they migrate to, not
#           how well documented they are.
# ─────────────────────────────────────────────────────────────────────────────
#
# GROUNDING SOURCE — each change grounds in EXACTLY ONE of `url` or `guide`:
#   The skill fetches `url` when an entry has one (WebFetch / qiskit-docs MCP);
#   otherwise it reads the local `guide` file. Publishing a guide is therefore a
#   one-line edit: REPLACE its `guide:` with the `url:` of the published page and
#   delete the local file, so there is never a second copy to drift out of sync.
#   Consequence: a `url` entry has NO local fallback. If the fetch fails, say so
#   and make no edits for that change — do not migrate it from general knowledge.
#
# Fields per change:
#   id:               change slug. Also the token a user can pass in $ARGUMENTS
#                     to force just this change (e.g. `/migrate-qiskit-ibm-runtime v1-to-v2`).
#   title:            display name.
#   domain:           grouping label for the report — one of:
#                       primitives | account-channel | execution | programs |
#                       jobs-results | misc-deprecations
#                     `primitives` is the bulk; the non-primitive domains are now
#                     authored too (grounded in migrate-non-primitive-apis.md). The
#                     `placeholder` status (see below) stays available for future
#                     additions that are routed before their actions are written.
#   guide:            repo-root-relative LOCAL grounding guide, for a change whose
#                     guide is not published. Its tables/sections ARE the Phase-5
#                     checklist when `status: active`. Mutually exclusive with
#                     `url` — when the guide is published, swap this for that.
#   url:              live doc URL — release notes, or an official migration guide.
#                     When set, the skill fetches it INSTEAD of a local file and it
#                     is the authoritative checklist. Any change may have one, hop B
#                     included. Prefer the `.md` form of a docs URL: it serves raw
#                     markdown, so it needs no HTML-to-text guessing.
#   companion_guide:  (optional) a SECOND grounding guide whose changes this
#                     change also inherits (used when a primitive change's
#                     client-side DESTINATION is documented in the shared
#                     server-to-client guide).
#   companion_url:    (optional) the same thing as a published URL. `companion_url`
#                     is to `companion_guide` what `url` is to `guide`, including
#                     being mutually exclusive with it.
#   status:           active | placeholder. `placeholder` = routing (detection +
#                     version window + url pointer) is defined, but the migration
#                     ACTIONS are not authored yet; the skill DETECTS and REPORTS
#                     the change but MUST NOT edit code for it.
#   code_evidence:    code | environment. `code` = every form is a literal symbol
#                     in source, so a `detect_*` match is meaningful on its own.
#                     `environment` = packaging/version state not visible by
#                     grepping source (e.g. which fake-backend classes exist);
#                     rely on the version window and say so.
#   applies_from:     change is relevant if the source version >= this
#                     (inclusive). null = no lower bound.
#   applies_to:       change is relevant if the source version < this (exclusive)
#                     — i.e. the release that REMOVED/renamed the old form, so
#                     code older than it needs the fix. null = no upper bound.
#   order:            reporting / apply sequence (ascending). The client-side
#                     primitives hop is deliberately near-LAST; only changes that
#                     REQUIRE it (the NoiseLearnerV3 hop) may come after.
#   detect_primary:   DECISIVE literal grep substrings (usually an import source
#                     or a symbol that appears in no modern code). A match here
#                     assigns the change.
#   detect_secondary: corroborating behavioral substrings — broad, expect false
#                     positives. Carry the matched line forward for eyeball
#                     confirmation; NEVER assign on these alone.
#   already_migrated: substrings meaning this change is already handled.
#   import_rewrite:   from/to import targets applied in Phase 4 (authored changes
#                     only).
#   note:             caveat surfaced verbatim in the migration plan.
#                     KEEP IT NARROW — `note` is only for what the agent needs
#                     that is (a) NOT already in the change's guide and (b) NOT
#                     generic Phase-5 policy from SKILL.md. Restating a guide
#                     table row, or the fact that the guide's tables are the
#                     checklist, belongs nowhere. Maintainer rationale (why an
#                     entry has no `url`, how a guide is written) goes in a `#`
#                     comment on the entry, not here. A note that outgrows ~1KB
#                     has usually absorbed one of these — move it out rather
#                     than letting the entry become the skill's scratchpad.

target_rule: >
  The target is the LATEST qiskit-ibm-runtime release, reached in two layers.
  HOP A (documented): apply every change whose grounding is a release-note or
  migration-guide `url`, bringing the code up to the current public API. HOP B
  (client-side primitives): the eventual destination is the client-side
  (Executor-backed) SamplerV2/EstimatorV2 in qiskit_ibm_runtime.executor_sampler
  / executor_estimator, released and documented in 0.50.0 — which also DEPRECATES
  the server-side SamplerV2/EstimatorV2 in favor of them.
  It is grounded in the PUBLISHED migration guide named by the `url` on the
  `server-to-client` entry (and by `companion_url` on `v1-to-v2`).
  Always run hop A before hop B, and only attempt hop B when the INSTALLED
  qiskit-ibm-runtime is >= 0.50.0 (min_runtime_version). State clearly in the
  plan that hop B is now the recommended destination and that the server-side
  primitives it replaces are on a deprecation clock.

min_runtime_version: "0.50.0"   # client-side (Executor-backed) primitives released here

changes:

  # ───────────────────────────── PRIMITIVES (the bulk — fully authored) ──────

  - id: v1-to-v2
    title: "Qiskit Runtime V1 primitives (Sampler/Estimator) -> client-side (Executor-backed) V2"
    domain: primitives
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-v1-to-client-side-primitives.md
    companion_url: https://quantum.cloud.ibm.com/docs/guides/migrate-to-client-side-primitives.md
    status: active
    code_evidence: code
    # The V1 primitives existed 0.2.0 -> removed in 0.28.0, but detection here is
    # BEHAVIORAL, not version-gated: in a current runtime the top-level
    # `Sampler`/`Estimator` names already resolve to a V2 primitive and `Options`
    # resolves to `OptionsV2`, so an import line CANNOT decide V1 vs V2. The V1
    # tells are behaviors: parallel-list .run(circuits, observables, parameter_values),
    # result.quasi_dists / .values, a flat Options() with resilience_level /
    # optimization_level, and set_options(). `quasi_dists` appears in NO V2 code and
    # is decisive on its own. Import-line primaries are weaker ("worth inspecting").
    # This covers the qiskit-ibm-runtime V1 primitives only. The Qiskit reference /
    # statevector primitives (`from qiskit.primitives import ...`) have a SEPARATE
    # migration guide and are intentionally NOT detected or rewritten here.
    applies_from: null
    applies_to: "0.28.0"     # V1 SamplerV1/EstimatorV1 fully removed in 0.28.0
    order: 5
    detect_primary:
      - "quasi_dists"                               # V1 Sampler result — decisive; appears in no V2 code
      - "from qiskit_ibm_runtime import Options"    # the V1 flat Options object (gone in V2)
      - "IBMSampler"                                # original V1 factory class (0.2.0, removed 0.5.0) — decisive
      - "IBMEstimator"                              # original V1 factory class (0.2.0, removed 0.6.0) — decisive
      - "sampler.close()"                           # V1 primitive close() (dep 0.7, removed 0.9.4) — no V2 primitive has close()
      - "estimator.close()"                         #   same; decisive on a match, but variable-name dependent
    detect_secondary:
      - ".values"                    # V1 Estimator result (broad; confirm it is a primitive result)
      - "set_options("               # V1 options API
      - "resilience_level"           # V1 flat option (also a V2 shortcut; confirm)
      - "optimization_level"         # V1 primitive option (V2 does not transpile; confirm on a primitive)
      - "skip_transpilation"         # V1 transpilation option — V2 has no transpilation option group at all
      - "Options("                   # V1 Options() construction
      - "import Sampler"             # bare V1 name (also a substring of SamplerV2 — confirm NOT V2)
      - "import Estimator"
      # Very old V1 tells (pre-run() era, qiskit-ibm-runtime < 0.11). See the guide's
      # "Older V1 syntax you may need to modernize first" section.
      - "IBMRuntimeService"          # pre-0.6 service name (renamed to QiskitRuntimeService in 0.4.0)
      - "circuit_indices"            # index-based primitive call inputs (removed 0.15.0)
      - "observable_indices"         # index-based primitive call inputs (removed 0.15.0)
    already_migrated:
      - "qiskit_ibm_runtime.executor_sampler"
      - "qiskit_ibm_runtime.executor_estimator"
    import_rewrite:
      - from: "from qiskit_ibm_runtime import Sampler"      # runtime V1
        to:   "from qiskit_ibm_runtime.executor_sampler import Sampler"
      - from: "from qiskit_ibm_runtime import Estimator"    # runtime V1
        to:   "from qiskit_ibm_runtime.executor_estimator import Estimator"
      # Also DROP `from qiskit_ibm_runtime import Options` (no V2 Options class) and
      # rewrite constructor `backend=`/`session=` -> `mode=`. These are structural,
      # not simple line swaps — the guide's sections drive them, not import_rewrite.
      # Very old V1 code (IBMSampler/IBMEstimator factory classes, IBMRuntimeService,
      # context-manager usage, circuit_indices/observable_indices, auth=, constructor
      # inputs) is ALSO structural — the guide's "Older V1 syntax you may need to
      # modernize first" section drives it; do not attempt a mechanical import swap.
    note: >
      Compound migration: the V1 -> V2 INTERFACE change (parallel-list `.run(...)`
      -> pub-based `.run([...])`; SparsePauliOp observables laid out per PUB; flat
      `Options`/`resilience_level`/`set_options` -> the options tree; `quasi_dists`
      / `.values` -> `result[i].data...`; ISA circuits required; `mode=`) AND the
      server-side -> client-side DESTINATION change (hop B). The interface part is
      in this change's `guide`; the client-side destination part is documented in
      `companion_guide` (the shared server-to-client guide) and the guide
      cross-references it rather than repeating it, so when applying this change you
      MUST also apply the companion guide's two incompatible-changes tables — fetch it
      by fetching `companion_url` (the published page). Highest-impact
      compound case: V1 `resilience_level = 3`
      (PEC) becomes `pec_mitigation = True` PLUS explicit NoiseLearnerV3 noise learning.

  - id: server-to-client
    title: "Server-side SamplerV2/EstimatorV2 -> client-side (Executor-backed) V2  [HOP B]"
    domain: primitives
    url: https://quantum.cloud.ibm.com/docs/guides/migrate-to-client-side-primitives.md
    companion_guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-older-v2-primitives.md
    status: active
    code_evidence: code
    applies_from: "0.50.0"   # client-side implementation released in 0.50.0 — hop B
    applies_to: null
    order: 6                 # deliberately LAST — this is the final client-side hop
    # The decisive tokens are the V2 CLASS NAMES, not a bare `from qiskit_ibm_runtime
    # import` line: that package also exports QiskitRuntimeService/Batch/Session and
    # the V1 Sampler/Estimator, so the bare import line does not distinguish a
    # server-side V2 usage. `already_migrated` (checked first) peels off the
    # client-side `executor_*` imports before these match.
    detect_primary:
      - "SamplerV2"
      - "EstimatorV2"
      - "qiskit_ibm_runtime.sampler"
      - "qiskit_ibm_runtime.estimator"
    detect_secondary:
      - "IBMInputValueError"
      - "job.primitive_id"
      - "job.inputs"
      - "asdict("                    # asdict() on an options_models class is deprecated (0.49.0) -> options.model_dump()
      - "shots_per_randomization"
    already_migrated:
      - "qiskit_ibm_runtime.executor_sampler"
      - "qiskit_ibm_runtime.executor_estimator"
    import_rewrite:
      - from: "from qiskit_ibm_runtime import SamplerV2"
        to:   "from qiskit_ibm_runtime.executor_sampler import Sampler"
      - from: "from qiskit_ibm_runtime import EstimatorV2"
        to:   "from qiskit_ibm_runtime.executor_estimator import Estimator"
    # This is the HOP-B entry. The client-side implementation is fully released as of
    # 0.50.0 (which also deprecates the server-side V2 primitives), and its migration guide
    # is PUBLISHED — so this entry grounds in `url` alone, with no local copy to drift.
    # That page also links onward to the published NoiseLearner -> NoiseLearnerV3 guide,
    # which is its own change (`noiselearner-to-v3`) because V3 requires this hop.
    # Its guides are written human-facing, as publishable migration guides: like every
    # guide this skill uses they carry no apply/flag policy of their own — not a policy block, and no
    # per-row verdict either — so SKILL.md's generic Phase-5 policy decides what is applied
    # automatically and what is flagged, from what each table row actually asks for.
    note: >
      Interfaces and options are largely unchanged: most edits are the import rewrites above
      plus the guide's two "Incompatible changes" tables. Two traps the guides do not flag:
      (1) Do NOT collapse to the future top-level
      `from qiskit_ibm_runtime import SamplerV2, EstimatorV2` — the guide calls that form
      "coming soon," and that is still true on 0.50.0: the top-level names resolve to the
      SERVER-SIDE `qiskit_ibm_runtime.sampler` / `.estimator` classes (verified on 0.50.0), which
      0.50.0 DEPRECATES in favor of the `executor_*` ones — their DeprecationWarning says the
      top-level import will be repointed in an upcoming release. Until it is, only the explicit
      `executor_sampler` / `executor_estimator` imports above get you the client-side primitive.
      (2) Options classes for both server-side and client-side V2 primitives have the same name
      but different import paths. DO NOT assume they are equivalent just because they have the
      same names. Server-side primitive options live in `qiskit_ibm_runtime.options`, whereas
      client-side in `qiskit_ibm_runtime.options_models`. For example:
      (2.1) `shots_per_randomization` means different things on the two paths: the SERVER-SIDE
      `options.MeasureNoiseLearningOptions` keeps the field and deprecates only its INT form
      (0.48.0 -> "auto"), while the CLIENT-SIDE `options_models` one REMOVES it entirely — so
      "use auto" is NOT the client-side action; use the guide's Estimator table row instead.
      (It stays in `detect_secondary` because it still flags code needing this migration.)
      (2.2) SERVER-SIDE `options.EnvironmentOptions` class does NOT include `max_execution_time`, but
      the CLIENT-SIDE one (`options_models.EnvironmentOptions`) does. However, that field is
      deprecated and raises a `DeprecationWarning`. Always use the top level option
      (`options.max_execution_time`) instead.
      Apply `companion_guide` (older V2 option forms) BEFORE the client-side edits: the
      client-side constructor rejects those forms, so a flat options dict still fails at
      construction after the imports are rewritten.
      Boundaries: `mode=` binding belongs to `execution-mode`; the
      `NoiseLearnerV3Options.post_selection` -> `bit_flip_checks.post_circuit` rename belongs
      to `noiselearner-post-selection`. If the code uses `NoiseLearner`, this hop FORCES
      `noiselearner-to-v3` — a client-side Estimator cannot consume a `NoiseLearner` noise model.

  - id: noiselearner-to-v3
    title: "NoiseLearner -> NoiseLearnerV3 (Executor / client-side Estimator only)"
    domain: misc-deprecations
    url: https://quantum.cloud.ibm.com/docs/guides/migrate-to-noise-learner-v3.md
    status: active
    code_evidence: code
    applies_from: null
    applies_to: null         # `NoiseLearner` is NOT removed (still present on 0.50.0) — trigger-driven, not version-gated
    order: 6.1               # AFTER server-to-client (6): V3 only works once the code is on Executor / client-side Estimator
    # `NoiseLearnerV3` is not a primitive, but this change is COUPLED to the hop-B primitives
    # change in both directions (see note), which is why it sits immediately after it.
    # Substring care: "NoiseLearner(" does NOT match "NoiseLearnerV3(" and "NoiseLearnerOptions"
    # does NOT match "NoiseLearnerV3Options", so both are decisive; "import NoiseLearner" IS a
    # prefix of "import NoiseLearnerV3", so it is only corroborating.
    detect_primary:
      - "NoiseLearner("                       # the old class — decisive (V3 constructor does not match)
      - "NoiseLearnerOptions"                 # server-side options class — decisive (V3Options does not match)
      - ".noise_learner import"               # old module path (noise_learner_v3 does not match)
      - "max_layers_to_learn"                 # exists only on the old options class
    detect_secondary:
      - "import NoiseLearner"                 # prefix of `import NoiseLearnerV3` — confirm it is NOT V3
      - "layer_noise_model"                   # Estimator option fed by the learned model; its input type changed
      - "LayerNoiseLearningOptions"
      - "NoiseLearnerResult"                  # old result class (V3 returns NoiseLearnerV3Results)
      - "twirling_strategy"                   # dropped on V3 (boxing defines it) — broad, also a general twirling option
    already_migrated:
      - "NoiseLearnerV3"
    import_rewrite:
      - from: "from qiskit_ibm_runtime.noise_learner import NoiseLearner"
        to:   "from qiskit_ibm_runtime import NoiseLearnerV3"
      - from: "from qiskit_ibm_runtime import NoiseLearner"      # confirm the name is NOT already NoiseLearnerV3
        to:   "from qiskit_ibm_runtime import NoiseLearnerV3"
      - from: "from qiskit_ibm_runtime.options import NoiseLearnerOptions"
        to:   "from qiskit_ibm_runtime.options_models import NoiseLearnerV3Options"
    note: >
      WARN THE USER BEFORE EDITING: the two learners are locked to opposite Estimator
      implementations. `NoiseLearner` works ONLY with the legacy server-side `Estimator`;
      `NoiseLearnerV3` works ONLY with `Executor` / the CLIENT-SIDE `Estimator`. So if the code
      still uses the server-side Estimator, migrating the learner alone WILL NOT WORK — say so
      plainly and either do `server-to-client` (hop B) in the same pass, or leave the learner on
      `NoiseLearner` until the user is ready to move. Conversely, doing hop B FORCES this change:
      a client-side Estimator cannot consume a `NoiseLearner` noise model. Apply this change AFTER
      hop B, never before. It is STRUCTURAL, not a rename: `run()` takes boxed
      `CircuitInstruction`s (via a boxing pass manager + unique-box helper) instead of circuits,
      and results become `NoiseLearnerV3Results` / `PauliLindbladMap` instead of
      `NoiseLearnerResult` / `LayerError`. Boundaries: `.generators`/`.rates` -> `.error` on OLD
      results is `noiselearner-result-accessors`; the `post_selection` rename is
      `noiselearner-post-selection`.

  # ─────────────────── NON-PRIMITIVE DOMAINS (authored) ──────────────────────
  #
  # Each entry below is now ACTIVE: its migration actions are authored in the
  # shared local guide `migrate-non-primitive-apis.md` — one section per change, named
  # by each entry's `# section:` comment (the guide is written human-facing, so its
  # headings are topic titles rather than change ids).
  # These are grounded LOCALLY rather than by `url`, because the release-notes page
  # is a single 160KB+ document whose anchors do not isolate a section on fetch, so
  # it is not a usable runtime checklist; the authoritative doc links live inside
  # each guide section instead. Publishing any section online later is still the
  # one-line `guide:` -> `url:` swap. Release notes (for reference only):
  #   https://quantum.cloud.ibm.com/docs/api/qiskit-ibm-runtime/release-notes

  - id: account-channel
    title: "Account & channel: auth= -> channel=, and the ibm_quantum channel sunset"
    domain: account-channel
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Account setup: `auth=` -> `channel=` and the `ibm_quantum` channel sunset"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.42.0"     # `channel="ibm_quantum"` removed by 0.42.0 (auth= replaced by channel= back in 0.3.0)
    order: 1
    detect_primary:
      - "auth="                       # replaced by channel= in 0.3.0
      - 'channel="ibm_quantum"'       # removed in 0.42.0 — use "ibm_quantum_platform"
      - "channel='ibm_quantum'"
    detect_secondary:
      - "save_account("
      - "channel="
    note: >
      Apply the "Account setup: `auth=` -> `channel=` and the `ibm_quantum` channel sunset" section of the guide. `auth=` -> `channel=` is
      mechanical (0.3.0); `channel="ibm_quantum"` (removed by 0.42.0) is a decision,
      not a string swap — prefer channel="ibm_quantum_platform" (channel="ibm_cloud"
      still works), but the token/instance usually differ on the cloud platform, so
      confirm the user has cloud credentials. NOTE the overlap with the primitives
      `v1-to-v2` guide, which already handles `auth=` / channel for PRIMITIVE code in
      its "Older V1 syntax" section; do the account/channel rewrite once.

  - id: backend-run-removed
    title: "backend.run() removed -> use the V2 primitives"
    domain: execution
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Running circuits: `backend.run()` -> the V2 primitives"
    companion_guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-v1-to-client-side-primitives.md
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.35.0"     # support for backend.run() removed in 0.35.0
    order: 2
    detect_primary:
      - "backend.run("
    detect_secondary:
      - ".run("                       # broad — confirm it is a Backend, not a primitive
    note: >
      Apply the "Running circuits: `backend.run()` -> the V2 primitives" section of the guide. This is a STRUCTURAL
      rewrite, not a symbol swap: bitstring/counts workloads move to SamplerV2,
      expectation-value workloads to EstimatorV2. Present the rewrite as a diff and
      confirm. The destination is the primitives, so the rewritten calls then feed
      into the primitives `v1-to-v2` / `server-to-client` changes — the
      companion_guide carries the ISA-circuit, options-tree, `mode=`, and
      result-access details rather than duplicating them here.

  - id: streaming-removed
    title: "Result streaming & websocket callbacks removed"
    domain: execution
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Result streaming and interim-result callbacks"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.38.0"     # streaming removed 0.32.0; remaining websocket code + callback env option removed 0.38.0
    order: 3
    detect_primary:
      - "stream_results"
      - "interim_results"
    detect_secondary:
      - "user_callback"
      - "callback="
    note: >
      Apply the "Result streaming and interim-result callbacks" section of the guide. There is NO streaming
      replacement (interim/stream results deprecated 0.25.0, endpoints removed
      0.32.0, remaining websocket code + `callback` env option removed 0.38.0):
      remove the streaming/callback wiring and poll `job.status()` / `job.result()`
      instead. Flag it — this drops a capability.

  - id: custom-programs-removed
    title: "Custom runtime programs (upload/pprint/RuntimeProgram) removed"
    domain: programs
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Custom runtime programs"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.16.0"     # methods related to using custom programs removed in 0.16.0
    order: 4
    detect_primary:
      - "upload_program"
      - "pprint_programs"
      - "RuntimeProgram"
    detect_secondary:
      - "delete_program"
      - "program_id"
    note: >
      Apply the "Custom runtime programs" section of the guide. Removed in 0.16.0
      with NO drop-in: a thin Sampler/Estimator-wrapper program becomes a direct V2
