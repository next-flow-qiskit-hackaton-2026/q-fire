  - id: session-from-id-backend
    title: "Session.from_id(): backend param removed (single-backend sessions), service became required in 0.28.0"
    domain: execution
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "`Session.from_id()`: no `backend`, and `service` is required"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: null         # backend= deprecated 0.15.0 and since removed; service optional through 0.26.0, required from 0.28.0 — trigger-driven (from_id(...))
    order: 2.6
    detect_primary:
