    detect_secondary:
      - ".from_id"
    note: >
      Apply the "`Session.from_id()`: no `backend`, and `service` is required" section of the guide. `Session.from_id()`'s
      `backend` parameter was DEPRECATED in 0.15.0 (a session is bound to a single backend)
      and has since been REMOVED — on 0.49.0 the signature is
      `from_id(session_id, service, use_fractional_gates=False, calibration_id=None)`, so
      passing `backend=` raises TypeError. Mechanical: drop the `backend` argument, keep
      `session_id` and `service`. IMPORTANT — `service` was NOT always required: briefly
      required in 0.15.0, reverted to optional in 0.15.1, stayed optional (deprecation
      warning added in 0.23.0) through at least 0.26.0, and only became a required
      positional parameter in 0.28.0 (2024-08-15). A `from_id(session_id)` call with no
      `service` is only broken relative to the current/target runtime (>= 0.28.0) — flag it
      as a version-threshold issue, not as "always broken"/"pre-existing bug regardless of
      version," when the source predates 0.28.0. Only relevant to code that reconstructs a
      Session from a stored id; confirm `from_id(` is `Session.from_id`, not an unrelated
      method of the same name.

