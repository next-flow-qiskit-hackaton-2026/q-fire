  - id: session-backend-consistency
    title: "A primitive inside a Session/Batch context manager must use the session's backend"
    domain: execution
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "One backend per session"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.34.0"     # the check was ADDED in 0.34.0; older code may rely on the old silent job-mode behavior
    order: 2.55
    # NO SINGLE SUBSTRING IS DECISIVE HERE: the trigger is a RELATIONSHIP between an
    # enclosing `with Session(...)`/`Batch(...)` and a primitive's `mode=` inside it, which a
    # grep cannot express. detect_primary is therefore deliberately EMPTY — inclusion comes
    # from the version window (source < 0.34.0), and the secondaries below say which blocks
    # to read. Unlike a removed symbol, this one can also be latent in code that never
    # raised: before 0.34.0 the primitive silently ran in JOB MODE against the backend
    # passed in, ignoring the enclosing session.
    detect_primary: []
    detect_secondary:
      - "with Session("              # the enclosing context manager to read
      - "with Batch("
      - "mode=backend"               # a backend (not the session) passed as the mode inside such a block
    note: >
      Apply the "One backend per session" section of the guide. Since 0.34.0 a primitive
      constructed inside an open `Session`/`Batch` context manager runs INSIDE that session
      even when a backend is passed as `mode=`, and raises `ValueError` ("The backend passed
      in to the primitive is different from the session backend...") when that backend is not
      the session's; passing the session's OWN backend still works but logs a warning.
      Detection is correlation-based (see the comment above): rely on the version window and
      READ each `with Session(...)` / `with Batch(...)` block rather than expecting a
      decisive grep hit. Report it as a BEHAVIOR change, not only an error: pre-0.34.0 code
      with a mismatched backend was silently running outside the session it appears to be in,
      so the fix is a decision about which the author meant — `mode=session` (or omitting
      `mode`) to run in the session, or moving the primitive out of the block to keep job
      mode. Boundary: the `backend=`/`session=` -> `mode=` rename itself is `execution-mode`.

