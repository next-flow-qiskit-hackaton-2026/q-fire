  - id: noiselearner-result-accessors
    title: "NoiseLearnerResult/LayerError .generators/.rates removed -> .error; classes moved to results package"
    domain: jobs-results
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Noise-learner results: `.generators` / `.rates` -> `.error`"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.36.0"     # .generators/.rates removed from NoiseLearnerResult/LayerError in 0.36.0
    order: 5.7
    # DECISIVE signal is the OLD import path (moved to `results` in 0.48.0). The accessor
    # tells `.generators`/`.rates` are SECONDARY on purpose: they are still valid on a
    # PauliLindbladError (the `.error` object), so they are ambiguous and must be
    # eyeball-confirmed to be on a NoiseLearnerResult/LayerError before rewriting.
    detect_primary:
      - "noise_learner_result"       # old import path qiskit_ibm_runtime.utils.noise_learner_result -> results (0.48.0)
    detect_secondary:
      - ".generators"                # removed from NoiseLearnerResult/LayerError -> .error.generators (still VALID on a PauliLindbladError)
      - ".rates"                     # same — confirm the object is a NoiseLearner result / LayerError, not an .error
      - "NoiseLearner"               # presence of noise learning corroborates a .generators/.rates hit
    import_rewrite:
      - from: "from qiskit_ibm_runtime.utils.noise_learner_result import"
        to:   "from qiskit_ibm_runtime.results import"
    note: >
      Apply the "Noise-learner results: `.generators` / `.rates` -> `.error`" section of the guide. The
      `NoiseLearnerResult` AND per-layer `LayerError` `.generators`/`.rates` properties were
      REMOVED in 0.36.0 — reach them through `.error` (a `PauliLindbladError`):
      `result.data[i].generators` -> `result.data[i].error.generators` (same for `.rates`).
      Pure access-path change, results-preserving, mechanical. CAVEAT: `.generators`/`.rates`
      are still valid ON a `PauliLindbladError` (i.e. on `x.error`), so only rewrite when the
      object is a NoiseLearnerResult/LayerError; a `detect_secondary` `.generators`/`.rates`
      hit needs eyeball confirmation and is never assigned on its own. Separately,
      `NoiseLearnerResult`/`LayerError`/`PauliLindbladError` MOVED to the
      `qiskit_ibm_runtime.results` package in 0.48.0 (old
      `qiskit_ibm_runtime.utils.noise_learner_result` path still works but is deprecated) — a
      mechanical import rewrite.

  - id: noiselearner-post-selection
    title: "NoiseLearnerV3 post_selection option renamed -> bit_flip_checks.post_circuit"
    domain: misc-deprecations
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Noise learning: `post_selection` -> `bit_flip_checks.post_circuit`"
    status: active
    code_evidence: code
    applies_from: "0.49.0"   # client-side-only option; deprecated 0.49.0 (guide-grounded — see note)
    applies_to: null
    order: 9.5
    # `NoiseLearnerV3` is NOT a primitive, so this option rename is a non-primitive change even
    # though it surfaces alongside the client-side (hop-B) primitives migration. `post_selection`
    # is the decisive token: it exists ONLY on the client-side `NoiseLearnerV3Options`
    # (options_models), not on the server-side `options.NoiseLearnerOptions`.
    detect_primary:
      - "post_selection"             # NoiseLearnerV3Options.post_selection -> bit_flip_checks.post_circuit
    detect_secondary:
      - "bit_flip_checks"            # the destination subtree — presence means it may be partly migrated
      - "NoiseLearnerV3"             # corroborates a noise-learner usage
    note: >
      Apply the "Noise learning: `post_selection` -> `bit_flip_checks.post_circuit`" section of the guide. `NoiseLearnerV3`'s
      `post_selection` option was deprecated (0.49.0) and RENAMED (not removed) to
      `bit_flip_checks.post_circuit`; the two subtrees are structurally identical
      (`enable`/`x_pulse_type`/`strategy`), so it is a mechanical, field-for-field path rewrite
      (`options.post_selection.enable` -> `options.bit_flip_checks.post_circuit.enable`). It is a
      client-side-only option (options_models). The 0.49.0 release note records only the
      DEPRECATION, not the destination path, so the rename mapping is guide-grounded (no `url`).
      Setting `post_selection` still works but emits a DeprecationWarning and will be removed no
      sooner than three months after 0.49.0.

  - id: pulse-surface-removed
    title: "Pulse surface removed: backend.defaults(), PulseBackendConfiguration/PulseDefaults, channel methods"
    domain: misc-deprecations
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Pulse-level access"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: "0.41.0"     # backend.defaults() removed 0.41.0 (dep 0.38.0); PulseBackendConfiguration/PulseDefaults removed 0.37.0 (Qiskit 2.0)
    order: 8.5
    detect_primary:
      - "PulseBackendConfiguration"  # removed 0.37.0 (Qiskit 2.0) -> QasmBackendConfiguration
      - "PulseDefaults"              # backend defaults no longer needed for the Target
      - "drive_channel"              # IBMBackend channel methods removed with pulse (Qiskit 2.0)
      - "control_channel"
      - "measure_channel"
      - "acquire_channel"
    detect_secondary:
      - ".defaults()"                # backend.defaults() removed 0.41.0 (broad — confirm it is a Backend)
    note: >
      Apply the "Pulse-level access" section of the guide. Pulse-level access was
      removed alongside Qiskit 2.0: `PulseBackendConfiguration` / `PulseDefaults` and the
      `IBMBackend` channel methods (`drive_channel`/`control_channel`/`measure_channel`/
      `acquire_channel`) were removed in 0.37.0, and `backend.defaults()` (deprecated
      0.38.0) was removed in 0.41.0. There is NO replacement — pulse-level control is gone
      from Qiskit. Backends now return a `QasmBackendConfiguration` and the `Target` is
      built without pulse defaults. Flag every occurrence; a workload that genuinely needed
      pulse control is a redesign, not a code edit. Boundary: this entry is the CLIENT API
      surface only — circuits that carry pulse gates are `pulse-gates-unsupported`.

  - id: pulse-gates-unsupported
    title: "Pulse gates no longer supported by the service (3 February 2025) -> fractional gates"
    domain: misc-deprecations
    guide: .claude/skills/migrate-qiskit-ibm-runtime/migrate-non-primitive-apis.md   # section: "Pulse gates are no longer supported"
    status: active
    code_evidence: code
    applies_from: null
    applies_to: null         # a SERVICE removal (3 February 2025), not tied to a client release — trigger-driven
    order: 8.6               # immediately after pulse-surface-removed (8.5): same withdrawal, service side
    # Substring care: "RZXCalibrationBuilder" also catches the "...NoEcho" variant, and does NOT
    # contain "RXCalibrationBuilder" (RZX vs RX), so both names are needed. On a CURRENT stack these
    # symbols raise ImportError/ModuleNotFoundError (qiskit.pulse, add_calibration and the
    # calibration-builder passes all went in Qiskit SDK 2.0), so the code usually fails to import
    # before the service ever sees it — do not report an ImportError here as an unrelated problem.
    detect_primary:
      - "qiskit.pulse"
      - "pulse.builder"
      - "ScheduleBlock"
      - "add_calibration"
      - "RXCalibrationBuilder"
      - "RZXCalibrationBuilder"      # also matches RZXCalibrationBuilderNoEcho
    detect_secondary:
      - "calibration"                # broad — confirm it is a pulse calibration, not a calibration_id
      - "Play("
      - "Gaussian("
    already_migrated:
      - "use_fractional_gates"
    note: >
      Apply the "Pulse gates are no longer supported" section of the guide. On 3 February 2025 the
      service stopped accepting PULSE GATES (custom calibrations attached to a submitted circuit);
      the replacement is FRACTIONAL GATES, requested per backend with
      `service.backend(name, use_fractional_gates=True)` (also valid on `least_busy`). NOT
      MECHANICAL — do not offer an auto-apply diff: fractional gates cover only single- and
      two-qubit rotations, and anything beyond that (custom pulse shapes, pulse-level
      characterization) has no drop-in and means Qiskit Dynamics, i.e. a redesign the user has to
      scope. Flag every match for human review and say which bucket you think it falls in. Boundary:
      the removal of the pulse API surface (`backend.defaults()`, `PulseBackendConfiguration`,
      channel accessors) is `pulse-surface-removed`.
